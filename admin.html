<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827"><meta name="description" content="Administração da biblioteca e dos convites do Assistente Vocal.">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/icon-192.png"><title>Administração | Assistente Vocal</title>
<style>
:root{color-scheme:dark;--bg:#081326;--panel:#14223b;--line:#3a5279;--txt:#f6f8ff;--muted:#b2c1d8;--cyan:#42d8e8;--green:#39dfa5;--red:#ff758f;--yellow:#ffd166;--violet:#b69aff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 8% 0%,#294a75 0,#101d35 35%,#081326 78%);color:var(--txt);font:15px/1.5 system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{min-height:44px;border:1px solid #49658f;border-radius:12px;padding:10px 14px;color:white;background:linear-gradient(135deg,#263e61,#1b2e4b);font-weight:700;cursor:pointer}button.primary{background:linear-gradient(135deg,#5750d8,#087eae)}button.good{background:linear-gradient(135deg,#087f69,#19a879)}button:disabled{opacity:.5;cursor:not-allowed}input,select{width:100%;min-height:44px;background:#0d1929;color:var(--txt);border:1px solid #435c83;border-radius:10px;padding:10px 12px}label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}.wrap{max-width:1180px;margin:auto;padding:22px 15px 50px}.hero{display:flex;align-items:center;gap:13px;margin-bottom:18px}.logo{width:50px;height:50px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(145deg,#07a4b8,#6455d7 62%,#d05d91);font-size:27px}.hero h1{font-size:clamp(23px,4vw,32px);margin:0}.hero p{margin:3px 0;color:var(--muted)}.panel{background:linear-gradient(145deg,rgba(26,43,72,.98),rgba(14,26,47,.98));border:1px solid var(--line);border-radius:18px;padding:17px;margin:0 0 14px;box-shadow:0 14px 34px #02081755}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.muted{color:var(--muted)}.small{font-size:12px}.hidden{display:none!important}.badge{border-radius:99px;padding:5px 9px;font-size:11px;font-weight:700;background:#244967;border:1px solid #397aa0}.song{border:1px solid #3b557d;background:linear-gradient(145deg,#1b3150,#12233e);border-radius:15px;padding:14px;margin:10px 0}.song h3{margin:0;font-size:17px}.list{display:grid;gap:8px}.check{display:flex;align-items:flex-start;gap:8px;background:#10213a;border:1px solid #334c70;border-radius:10px;padding:8px}.check input{width:18px;min-height:18px;margin-top:2px;accent-color:#42d8e8}.output{background:#0c1a2b;border:1px solid #3a5279;border-radius:12px;padding:12px;overflow-wrap:anywhere}.auth{max-width:430px;margin:12vh auto;padding:25px}.auth form{display:grid;gap:10px}
</style></head>
<body>
<section class="panel auth" id="authPanel">
 <div class="hero"><div class="logo">♫</div><div><h1>Administração</h1></div></div>
 <button class="primary" id="googleLoginBtn" type="button" style="width:100%;margin:4px 0 12px;background:linear-gradient(135deg,#2563eb,#0f766e)">Entrar com Google</button>
 <p id="authMessage" class="small muted">Restrito ao administrador.</p>
</section>

<main class="wrap hidden" id="adminApp">
 <header class="hero"><div class="logo">♫</div><div><h1>Gestão Vocal</h1><p>Músicas e Convites de Acesso Rápido</p></div><div style="margin-left:auto" class="row"><a href="/" style="color:#9feaf2;text-decoration:none;font-weight:700">← Ir para o app</a><button id="logoutBtn">Sair</button></div></header>
 
 <section class="panel">
  <h2 style="margin:0 0 4px">1. Criar Link Mágico para Cantora</h2>
  <p class="small muted">Este link fará o login automático da pessoa, sem pedir senha.</p>
  <form id="inviteForm">
   <div class="field" style="margin-bottom: 15px;"><label>Nome (opcional para identificar o convite)</label><input id="inviteName" placeholder="Ex: Marla"></div>
   <div style="margin-bottom: 15px;"><label>Quais músicas ela pode acessar?</label><div id="inviteMusicList" class="list"></div></div>
   <div class="row"><button class="good" type="submit">Gerar Link de Acesso</button><span id="inviteStatus" class="small muted"></span></div>
  </form>
  <div id="inviteOutput" class="output hidden" style="margin-top:12px">
    <div><b>Link gerado com sucesso!</b> Envie isso para a cantora:</div>
    <p id="inviteUrlResult" style="font-size:15px; color:#42d8e8; margin: 10px 0;"></p>
    <div class="row"><button id="copyInvite" type="button">Copiar Mensagem</button><button class="good" id="whatsappInvite" type="button">Enviar pelo WhatsApp</button></div>
  </div>
 </section>

 <section class="panel"><div class="row between"><div><h2 style="margin:0">2. Convites Ativos</h2></div><button id="refreshInvites">Atualizar</button></div><div id="inviteList" class="list" style="margin-top: 10px;"></div></section>
</main>

<script type="module">
import {auth,db} from './firebase-config.js';
import {GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {collection,doc,getDoc,getDocs,setDoc,serverTimestamp,Timestamp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

const $=id=>document.getElementById(id); let adminUser=null, lastInvite=null, songs=[];

$('googleLoginBtn').addEventListener('click',async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){$('authMessage').textContent=e.message}});
$('logoutBtn').addEventListener('click',()=>signOut(auth));

onAuthStateChanged(auth,async user=>{
  if(!user){$('adminApp').classList.add('hidden');$('authPanel').classList.remove('hidden');return;}
  try{
    const snap=await getDoc(doc(db,'admins',user.uid));
    const isMainAdmin = String(user.email).toLowerCase()==='andersonsieklicki@gmail.com';
    if(!isMainAdmin && (!snap.exists() || !snap.data().ativo)){ await signOut(auth); throw new Error('Acesso negado.'); }
    adminUser=user; $('authPanel').classList.add('hidden'); $('adminApp').classList.remove('hidden');
    
    // Carrega músicas
    const musSnap = await getDocs(collection(db,'musicas'));
    songs = musSnap.docs.map(d=>({id:d.id,...d.data()}));
    
    const box=$('inviteMusicList'); box.replaceChildren();
    songs.forEach(s=>{
      const row=document.createElement('div'); row.className='check';
      row.innerHTML=`<input type="checkbox" value="${s.id}" id="s_${s.id}" checked><label for="s_${s.id}">${s.titulo}</label>`;
      box.append(row);
    });
    refreshInvites();
  }catch(e){$('authMessage').textContent=e.message;}
});

function shortCode(){ return 'AV-' + Math.random().toString(36).substring(2, 8).toUpperCase(); }

$('inviteForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const name=$('inviteName').value.trim();
  const musicIds=[...$('inviteMusicList').querySelectorAll('input:checked')].map(i=>i.value);
  if(!musicIds.length){ $('inviteStatus').textContent='Selecione ao menos 1 música.'; return; }
  
  const code=shortCode();
  const expires=new Date(Date.now()+ 30 * 86400000); // 30 dias
  
  try{
    await setDoc(doc(db,'convites',code),{nome:name, musicaIds:musicIds, status:'ativo', criadoPor:adminUser.uid, createdAt:serverTimestamp(), expiraEm:Timestamp.fromDate(expires)});
    lastInvite={code,name};
    const url=new URL('/',location.origin); url.searchParams.set('convite',code);
    $('inviteUrlResult').textContent = url.toString();
    $('inviteOutput').classList.remove('hidden');
    $('inviteStatus').textContent='Criado com sucesso!';
    refreshInvites();
  }catch(err){ $('inviteStatus').textContent=err.message; }
});

function inviteText(){
  const url=new URL('/',location.origin); url.searchParams.set('convite',lastInvite.code);
  return `Olá! Aqui está o seu link mágico de acesso ao estúdio Estrelinha. É só clicar e colocar seu nome para entrar:\n\n👉 ${url.toString()}`;
}

$('copyInvite').addEventListener('click',()=>navigator.clipboard.writeText(inviteText()));
$('whatsappInvite').addEventListener('click',()=>window.open(`https://wa.me/?text=${encodeURIComponent(inviteText())}`,'_blank'));

async function refreshInvites(){
  const snap=await getDocs(collection(db,'convites'));
  const box=$('inviteList'); box.replaceChildren();
  snap.docs.forEach(d=>{
    const v=d.data(), row=document.createElement('div'); row.className='song';
    row.innerHTML=`<b>${v.nome||'Sem nome'} (${d.id})</b><p class="small muted" style="margin:2px 0 0;">Status: ${v.status} · Músicas: ${v.musicaIds.length}</p>`;
    box.append(row);
  });
}
</script>
</body></html>
