<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#121826">
  <title>Assistente Vocal — Estrelinha</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <style>
    :root { --bg: #09111e; --panel: #131f31; --cyan: #42d8e8; --green: #39dfa5; --txt: #f6f8ff; --muted: #b2c1d8; }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--txt); padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .hidden { display: none !important; }
    .app-container { max-width: 600px; width: 100%; }
    
    /* Header & Estrelinha */
    .header { text-align: center; margin-bottom: 30px; }
    .estrelinha-avatar { width: 120px; height: 120px; background: radial-gradient(circle, #ffd166, #ff9f1c); border-radius: 50%; margin: 0 auto 15px; display: grid; place-items: center; font-size: 60px; box-shadow: 0 0 30px #ff9f1c66; border: 4px solid #fff; }
    .header h1 { margin: 0 0 5px; font-size: 24px; }
    .header p { margin: 0; color: var(--muted); font-size: 15px; }
    .guidance-box { background: #1a2942; border: 1px solid #2d405b; border-radius: 12px; padding: 15px; margin-bottom: 25px; text-align: center; color: var(--cyan); font-weight: 500; }

    /* Ações Principais */
    .main-actions { display: grid; gap: 15px; }
    .action-btn { background: linear-gradient(135deg, #1e324f, #15243a); border: 1px solid #334c70; border-radius: 16px; padding: 20px; text-align: left; cursor: pointer; transition: transform 0.2s, border-color 0.2s; color: white; display: flex; flex-direction: column; gap: 5px; }
    .action-btn:hover { transform: translateY(-2px); }
    .action-btn.silvane { border-left: 4px solid #42d8e8; }
    .action-btn.marla { border-left: 4px solid #b69aff; }
    .action-btn.juntas { border-left: 4px solid #ffd166; }
    .action-btn strong { font-size: 18px; }
    .action-btn span { font-size: 13px; color: var(--muted); }

    /* Sala de Treinamento (Motor de Áudio) */
    .training-room { background: var(--panel); border: 1px solid #2d405b; border-radius: 16px; padding: 20px; margin-top: 20px; }
    .playback-controls { display: flex; gap: 10px; margin-top: 20px; justify-content: center; }
    .playback-controls button { background: #263e61; border: 1px solid #49658f; color: white; padding: 12px 24px; border-radius: 12px; font-weight: bold; cursor: pointer; }
    .playback-controls button.primary { background: linear-gradient(135deg, #087f69, #19a879); border: none; }
    .playback-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
    
    /* Pitch Visualizer */
    .pitch-area { text-align: center; margin: 30px 0; background: #0c1524; padding: 20px; border-radius: 12px; border: 1px solid #1f304a; }
    .target-note { font-size: 48px; font-weight: 800; color: var(--cyan); line-height: 1; }
    .sung-note { font-size: 18px; color: var(--muted); margin-top: 10px; }
    
    /* Auth & Admin */
    .top-bar { display: flex; justify-content: space-between; width: 100%; margin-bottom: 20px; font-size: 12px; color: var(--muted); }
    .top-bar button, .top-bar a { background: none; border: none; color: var(--cyan); cursor: pointer; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

<div class="top-bar">
  <span id="userStatus">Aguardando login...</span>
  <div>
    <a href="/admin.html" id="adminLink" class="hidden">Admin</a>
    <button id="logoutBtn" class="hidden">Sair</button>
  </div>
</div>

<div class="app-container" id="authScreen">
  <div class="header">
    <div class="estrelinha-avatar">⭐</div>
    <h1>Assistente Vocal</h1>
    <p>Acesse com seu e-mail cadastrado.</p>
  </div>
  <div class="training-room">
    <input type="email" id="emailInput" placeholder="E-mail" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:1px solid #334c70; background:#09111e; color:white;">
    <input type="password" id="passInput" placeholder="Senha" style="width:100%; padding:12px; margin-bottom:20px; border-radius:8px; border:1px solid #334c70; background:#09111e; color:white;">
    <button id="loginBtn" style="width:100%; padding:14px; background:#42d8e8; border:none; border-radius:8px; font-weight:bold; cursor:pointer; color:#09111e;">Entrar</button>
    <p id="authMsg" style="color:#ff758f; text-align:center; font-size:13px; margin-top:10px;"></p>
  </div>
</div>

<div class="app-container hidden" id="mainMenu">
  <div class="header">
    <div class="estrelinha-avatar">⭐</div>
    <h1>Olá, <span id="userName">Cantora</span>!</h1>
    <p>Música atual: <strong id="currentSong">Estrelinha</strong></p>
  </div>
  
  <div class="guidance-box" id="estrelinhaGuidance">
    "Escolha uma aula abaixo para começarmos o treinamento."
  </div>

  <div class="main-actions">
    <button class="action-btn silvane" data-mode="silvane">
      <strong>🎤 TREINAR SILVANE</strong>
      <span>Aprender e avaliar a melodia da voz principal.</span>
    </button>
    <button class="action-btn marla" data-mode="marla">
      <strong>🎶 TREINAR MARLA</strong>
      <span>Aprender e isolar a segunda voz (harmonia).</span>
    </button>
    <button class="action-btn juntas" data-mode="duet">
      <strong>♫ CANTAR JUNTAS</strong>
      <span>Playback completo com as duas vozes alinhadas.</span>
    </button>
  </div>
</div>

<div class="app-container hidden" id="trainingRoom">
  <div class="header">
    <div class="estrelinha-avatar" style="width:80px; height:80px; font-size:40px;">⭐</div>
    <h2 id="roomTitle">Treinamento</h2>
    <p id="roomSubtitle">Carregando faixas...</p>
  </div>

  <div class="training-room">
    <div class="pitch-area" id="pitchArea">
      <div style="font-size:12px; color:#b2c1d8; margin-bottom:5px;">NOTA ESPERADA</div>
      <div class="target-note" id="expectedNote">—</div>
      <div class="sung-note" id="sungNote">Aguardando voz...</div>
    </div>

    <div style="text-align:center; color:var(--muted); font-size:14px; font-variant-numeric: tabular-nums;" id="timeDisplay">00:00 / 00:00</div>
    
    <div class="playback-controls">
      <button id="btnBack">← Voltar</button>
      <button id="btnPlay" class="primary" disabled>▶ Iniciar</button>
      <button id="btnStop" disabled>■ Parar</button>
    </div>
  </div>
</div>

<script type="module">
import { auth, db } from './firebase-config.js';
import { signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

const $ = id => document.getElementById(id);

// --- ESTADO GLOBAL ---
let audioCtx = null;
let tracks = { instrument: null, lead: null, harmony: null };
let sources = [];
let gains = {};
let isPlaying = false;
let startTime = 0;
let offset = 0;
let duration = 0;
let animationFrameId = null;
let currentMode = null;
let mapEvents = []; 

// --- AUTENTICAÇÃO ---
$('loginBtn').addEventListener('click', async () => {
  try {
    await signInWithEmailAndPassword(auth, $('emailInput').value, $('passInput').value);
  } catch(e) {
    $('authMsg').textContent = "Erro ao logar. Verifique credenciais.";
  }
});

$('logoutBtn').addEventListener('click', () => signOut(auth));

onAuthStateChanged(auth, async (user) => {
  if (user) {
    $('authScreen').classList.add('hidden');
    $('mainMenu').classList.remove('hidden');
    $('logoutBtn').classList.remove('hidden');
    
    const isAdmin = (user.email === 'andersonsieklicki@gmail.com');
    if (isAdmin) $('adminLink').classList.remove('hidden');
    
    // Na Fase 3 o Firestore trará os links de áudio. Para a Fase 1/2, usamos mocks ou caminhos locais definidos no Admin.
    $('userName').textContent = user.displayName || user.email.split('@')[0];
    
    // Pré-carrega o mapa da música Estrelinha
    try {
      const mapSnap = await getDoc(doc(db, 'bibliotecaMusical', 'estrelinha'));
      if(mapSnap.exists() && mapSnap.data().events) mapEvents = mapSnap.data().events;
    } catch(e) {}

  } else {
    $('authScreen').classList.remove('hidden');
    $('mainMenu').classList.add('hidden');
    $('logoutBtn').classList.add('hidden');
    $('adminLink').classList.add('hidden');
  }
});

// --- MOTOR DE ÁUDIO ---
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    gains.instrument = audioCtx.createGain();
    gains.lead = audioCtx.createGain();
    gains.harmony = audioCtx.createGain();
    const compressor = audioCtx.createDynamicsCompressor();
    
    gains.instrument.connect(compressor);
    gains.lead.connect(compressor);
    gains.harmony.connect(compressor);
    compressor.connect(audioCtx.destination);
  }
}

async function fetchAudio(url) {
  const res = await fetch(url);
  const arrayBuffer = await res.arrayBuffer();
  return await audioCtx.decodeAudioData(arrayBuffer);
}

// Simulador de carregamento de faixas (Na fase 3 conectaremos aos URLs do TV Box/Storage)
async function loadSongForMode(mode) {
  $('mainMenu').classList.add('hidden');
  $('trainingRoom').classList.remove('hidden');
  
  currentMode = mode;
  $('roomTitle').textContent = mode === 'silvane' ? 'Voz Principal (Silvane)' : mode === 'marla' ? 'Segunda Voz (Marla)' : 'Dueto';
  $('estrelinhaGuidance').textContent = mode === 'silvane' ? '"Silvane, acompanhe esta melodia."' : mode === 'marla' ? '"Marla, agora é sua vez de entrar."' : '"Agora vamos cantar juntas!"';
  $('roomSubtitle').textContent = 'Preparando motor de áudio...';
  
  initAudio();
  if(audioCtx.state === 'suspended') await audioCtx.resume();
  
  try {
    // AQUI: Conectar aos arquivos hospedados. Exemplo estrutural.
    // tracks.instrument = await fetchAudio('url_do_playback.mp3');
    // tracks.lead = await fetchAudio('url_da_voz_silvane.mp3');
    // tracks.harmony = await fetchAudio('url_da_voz_marla.mp3');
    
    // Mock de duração para interface funcional
    duration = 180; 
    
    // Configuração de Volume por Modo
    gains.instrument.gain.value = 0.8;
    gains.lead.gain.value = (mode === 'silvane' || mode === 'duet') ? 0.6 : 0.1;
    gains.harmony.gain.value = (mode === 'marla' || mode === 'duet') ? 0.8 : 0.0;

    $('roomSubtitle').textContent = 'Tudo pronto. Clique em Iniciar.';
    $('btnPlay').disabled = false;
  } catch (e) {
    $('roomSubtitle').textContent = 'Erro ao carregar faixas de áudio.';
  }
}

function stopAudio() {
  sources.forEach(s => s.stop());
  sources = [];
  isPlaying = false;
  offset = 0;
  cancelAnimationFrame(animationFrameId);
  $('btnPlay').disabled = false;
  $('btnStop').disabled = true;
  $('expectedNote').textContent = "—";
}

function playAudio() {
  if(isPlaying) return;
  
  sources = [];
  startTime = audioCtx.currentTime;
  
  // Para cada buffer carregado, criamos um Source e conectamos ao seu Gain
  Object.keys(tracks).forEach(key => {
    if (tracks[key]) {
      const source = audioCtx.createBufferSource();
      source.buffer = tracks[key];
      source.connect(gains[key]);
      source.start(0, offset);
      sources.push(source);
    }
  });
  
  isPlaying = true;
  $('btnPlay').disabled = true;
  $('btnStop').disabled = false;
  
  updateEngine();
}

// Loop de atualização Visual e Pitch
function updateEngine() {
  if (!isPlaying) return;
  const currentTime = audioCtx.currentTime - startTime + offset;
  
  if (currentTime >= duration) {
    stopAudio();
    return;
  }
  
  const m = Math.floor(currentTime / 60).toString().padStart(2, '0');
  const s = Math.floor(currentTime % 60).toString().padStart(2, '0');
  const dm = Math.floor(duration / 60).toString().padStart(2, '0');
  const ds = Math.floor(duration % 60).toString().padStart(2, '0');
  $('timeDisplay').textContent = `${m}:${s} / ${dm}:${ds}`;
  
  // Busca a nota esperada no mapa musical
  const activeEvent = mapEvents.find(e => currentTime >= e.start && currentTime <= (e.start + e.duration) && e.verified);
  if (activeEvent) {
    const midiNote = currentMode === 'marla' ? activeEvent.harmonyMidi : activeEvent.leadMidi;
    $('expectedNote').textContent = midiToName(midiNote);
  } else {
    $('expectedNote').textContent = "—";
  }
  
  animationFrameId = requestAnimationFrame(updateEngine);
}

// Utilitários
const noteNames = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function midiToName(midi) {
  if(!midi) return "—";
  return noteNames[midi % 12] + (Math.floor(midi / 12) - 1);
}

// Navegação
document.querySelectorAll('.action-btn').forEach(btn => {
  btn.addEventListener('click', () => loadSongForMode(btn.dataset.mode));
});
$('btnPlay').addEventListener('click', playAudio);
$('btnStop').addEventListener('click', stopAudio);
$('btnBack').addEventListener('click', () => {
  stopAudio();
  $('trainingRoom').classList.add('hidden');
  $('mainMenu').classList.remove('hidden');
  $('btnPlay').disabled = true;
});
</script>
</body>
</html>
